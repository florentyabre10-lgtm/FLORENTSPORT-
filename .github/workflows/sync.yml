name: Automatique Matchs Sync

on:
  schedule:
    # S'exécute toutes les 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install node-fetch firebase
      - run: node sync.js
        env:
          API_KEY_SPORTS: ${{ secrets.API_KEY_SPORTS }}
